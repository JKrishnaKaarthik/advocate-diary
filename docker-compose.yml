services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary -d diary"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2024.12.18
    environment:
      MINIO_ROOT_USER: diary
      MINIO_ROOT_PASSWORD: diarydiary
      MINIO_DEFAULT_BUCKETS: advocate-diary
    ports:
      - "9000:9000"
      - "9001:9001"
