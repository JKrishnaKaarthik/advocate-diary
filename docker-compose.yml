services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary -d diary"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2024.12.18
    environment:
      MINIO_ROOT_USER: diary
      MINIO_ROOT_PASSWORD: diarydiary
      MINIO_DEFAULT_BUCKETS: advocate-diary
    ports:
      - "9000:9000"
      - "9002:9001"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://diary:diary@postgres:5432/diary?sslmode=disable
      HTTP_ADDR: ":8080"
      SESSION_SECRET: dev-only-change-me-please
      COOKIE_SECURE: "false"
      WEB_ROOT: /app/web/dist
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: advocate-diary
      S3_ACCESS_KEY: diary
      S3_SECRET_KEY: diarydiary
      S3_PATH_STYLE: "true"
      SMTP_HOST: ""
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
